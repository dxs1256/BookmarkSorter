name: Build & Release Chrome Extension

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: version
        run: |
          set -euo pipefail

          # 单一事实源：manifest.json 的 version 字段。
          # 旧脚本用 `git tag --sort=-version:refname` 推算，仓库里存在
          # v20251227-<sha> 这类 tag 时会把它们排到最前，导致版本号算错。
          CURRENT=$(jq -r '.version' manifest.json)

          # Chrome 版本号必须是 1~4 段数字，这里强校验，避免脏数据流进发布
          if ! [[ "$CURRENT" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::manifest.json 的 version 非法：$CURRENT"
            exit 1
          fi

          IFS='.' read -r -a PARTS <<< "$CURRENT"
          while [ "${#PARTS[@]}" -lt 3 ]; do PARTS+=("0"); done

          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          # 点一下就跑，版本号自动 +1，不做任何询问。
          # 想发大版本（1.x -> 2.0.0）时，直接改 manifest.json 的 version
          # 再点运行即可，脚本会以它为基础继续递增。
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          jq --arg v "$NEXT" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "发布版本：$CURRENT -> $NEXT"

      - name: Verify manifest
        run: |
          set -euo pipefail
          jq empty manifest.json
          # 设置页与背景脚本必须真实存在，否则装上是坏的
          jq -e '.options_ui.page' manifest.json > /dev/null
          for f in background.js options.html options.js; do
            [ -f "$f" ] || { echo "::error::缺少文件 $f"; exit 1; }
          done
          for size in 16 32 48 128; do
            [ -f "icons/icon${size}.png" ] || { echo "::error::缺少图标 icons/icon${size}.png"; exit 1; }
          done

      - name: Package
        run: |
          set -euo pipefail
          ARCHIVE="bookmark-sorter-v${{ steps.version.outputs.version }}.zip"

          # README 以「使用说明.md」的形式保留在压缩包里，用户解压即可看到
          if [ -f README.md ]; then
            cp README.md "使用说明.md"
          fi

          zip -r "$ARCHIVE" . \
            -x "*.git*" ".github/*" "*.zip" "builds/*" "node_modules/*" "test/*" \
               ".gitignore" "README.md" "CHANGELOG.md" "LICENSE"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          unzip -l "$ARCHIVE"
          # 装上去必须能用：清单里的入口文件都要在包里
          for f in manifest.json background.js options.html options.js; do
            unzip -l "$ARCHIVE" "$f" > /dev/null || { echo "::error::压缩包缺少 $f"; exit 1; }
          done

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "🔥 Bookmark Sorter v${{ steps.version.outputs.version }}"
          make_latest: true
          files: ${{ env.ARCHIVE }}
          body: |
            ## ✨ 核心功能
            - ✅ **递归排序**所有子文件夹
            - ✅ **多种排序依据**：视觉长度 / 标题 / 域名 / 添加时间，方向可选
            - ✅ **书签与文件夹**可分块或混排，文件夹可在前也可在后
            - ✅ **设置页**随时调整策略（扩展详情 → 扩展程序选项）

            ## 📦 安装步骤
            1. 下载 `bookmark-sorter-v${{ steps.version.outputs.version }}.zip` → 解压
            2. 打开 `chrome://extensions/` → 开启开发者模式
            3. **加载已解压的扩展程序** → 选择解压后的文件夹
            4. 任意页面**右键 → 全部书签递归排序**

            ## 🔒 隐私
            书签数据全部在本地处理，不联网、不上传、不收集任何信息。

            ---
            **⭐ 喜欢请点 Star 支持！**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
